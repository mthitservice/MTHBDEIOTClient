# Azure DevOps Pipeline für MTH BDE IoT Client - Raspberry Pi Release
# Automatisch bei Git Tags gestartet (v*)

# Pipeline startet nur bei neuen Git Tags
resources:
  repositories:
  - repository: self
    type: git
    ref: refs/heads/master

# Trigger nur bei Tags
pr: none
trigger:
  branches:
    exclude:
    - "*"  # Keine Branch-Triggers
  tags:
    include:
    - "v*"  # Nur bei Tags die mit 'v' beginnen

variables:
  # Global Variables
  artifactName: 'RaspberryPiReleases'
  buildConfiguration: 'production'
  nodeVersion: '20.x'
  
  # GitHub Configuration
  githubRepository: 'mthitservice/MTHBDEIOTClient'
  githubConnection: 'github-connection'  # Muss in Azure DevOps konfiguriert sein
  
  # Cleanup Configuration
  keepPatchReleases: 10  # Anzahl der Patch-Releases die behalten werden sollen
  keepPipelineBuilds: 20  # Anzahl der Pipeline Builds die behalten werden sollen

stages:
# =============================================================================
# STAGE 1: Version Detection
# =============================================================================
- stage: VersionDetection
  displayName: 'Detect Version from Git Tag'
  jobs:
  - job: DetectVersion
    displayName: 'Extract Version from Git Tag'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      fetchDepth: 1
      
    - task: PowerShell@2
      displayName: 'Extract Version from Git Tag'
      inputs:
        targetType: 'inline'
        script: |
          # Git Tag auslesen (z.B. v1.0.47 -> 1.0.47)
          $gitTag = "$(Build.SourceBranch)"
          Write-Host "Git Source Branch: $gitTag"
          
          if ($gitTag -match "refs/tags/v(.+)") {
              $version = $matches[1]
              Write-Host "Extracted Version: $version"
              Write-Host "##vso[task.setvariable variable=releaseVersion;isOutput=true]$version"
              Write-Host "##vso[task.setvariable variable=gitTag;isOutput=true]v$version"
          } else {
              Write-Error "No valid version tag found in: $gitTag"
              exit 1
          }
      name: 'versionInfo'

# =============================================================================
# STAGE 2: Build Raspberry Pi Packages
# =============================================================================
- stage: BuildRaspberryPi
  displayName: 'Build Raspberry Pi Packages'
  dependsOn: VersionDetection
  variables:
    releaseVersion: $[ stageDependencies.VersionDetection.DetectVersion.outputs['versionInfo.releaseVersion'] ]
    gitTag: $[ stageDependencies.VersionDetection.DetectVersion.outputs['versionInfo.gitTag'] ]
  jobs:
  
  # ARM64 Build (Raspberry Pi 4, Pi 5)
  - job: BuildARM64
    displayName: 'Build ARM64 (Raspberry Pi 4/5)'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      submodules: true
      
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: $(nodeVersion)
        
    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | App/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)" | App/package-lock.json
          npm | "$(Agent.OS)"
        path: 'App/node_modules'
        cacheHitVar: 'CACHE_RESTORED'
        
    - script: |
        cd App
        echo "=== ARM64 BUILD PROCESS ==="
        echo "Cache restored: $(CACHE_RESTORED)"
        
        echo "Installing dependencies..."
        if [ "$CACHE_RESTORED" != "true" ]; then
            echo "Fresh install (cache miss)"
            npm ci --production=false
        else
            echo "Using cached dependencies"
            # Nur prüfen ob node_modules vollständig ist
            npm ci --production=false --prefer-offline
        fi
        
        echo "Setting version to $(releaseVersion)"
        npm version $(releaseVersion) --no-git-tag-version --allow-same-version
        
        echo "Building ARM64 package..."
        npm run package:raspberry-optimized -- --arch=arm64
        
        echo "Creating output directory..."
        mkdir -p $(Build.ArtifactStagingDirectory)/arm64
        
        echo "Copying ARM64 package..."
        find release -name "*.deb" -path "*/make/deb/arm64/*" -exec cp {} $(Build.ArtifactStagingDirectory)/arm64/ \;
        
        echo "Verifying ARM64 package..."
        ls -la $(Build.ArtifactStagingDirectory)/arm64/
      displayName: 'Build ARM64 Package'
      
    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARM64 Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/arm64'
        artifact: 'arm64-packages'

  # ARMv7l Build (Raspberry Pi 3)
  - job: BuildARMv7l
    displayName: 'Build ARMv7l (Raspberry Pi 3)'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      submodules: true
      
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: $(nodeVersion)
        
    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | App/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)" | App/package-lock.json
          npm | "$(Agent.OS)"
        path: 'App/node_modules'
        cacheHitVar: 'CACHE_RESTORED'
        
    - script: |
        cd App
        echo "=== ARMv7l BUILD PROCESS ==="
        echo "Cache restored: $(CACHE_RESTORED)"
        
        echo "Installing dependencies..."
        if [ "$CACHE_RESTORED" != "true" ]; then
            echo "Fresh install (cache miss)"
            npm ci --production=false
        else
            echo "Using cached dependencies"
            # Nur prüfen ob node_modules vollständig ist
            npm ci --production=false --prefer-offline
        fi
        
        echo "Setting version to $(releaseVersion)"
        npm version $(releaseVersion) --no-git-tag-version --allow-same-version
        
        echo "Building ARMv7l package..."
        npm run package:raspberry-optimized -- --arch=armv7l
        
        echo "Creating output directory..."
        mkdir -p $(Build.ArtifactStagingDirectory)/armv7l
        
        echo "Copying ARMv7l package..."
        find release -name "*.deb" -path "*/make/deb/armv7l/*" -exec cp {} $(Build.ArtifactStagingDirectory)/armv7l/ \;
        
        echo "Verifying ARMv7l package..."
        ls -la $(Build.ArtifactStagingDirectory)/armv7l/
      displayName: 'Build ARMv7l Package'
      
    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARMv7l Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/armv7l'
        artifact: 'armv7l-packages'

# =============================================================================
# STAGE 3: Deploy to GitHub
# =============================================================================
- stage: Deploy
  displayName: 'Deploy to GitHub'
  dependsOn: 
  - VersionDetection
  - BuildRaspberryPi
  variables:
    releaseVersion: $[ stageDependencies.VersionDetection.DetectVersion.outputs['versionInfo.releaseVersion'] ]
    gitTag: $[ stageDependencies.VersionDetection.DetectVersion.outputs['versionInfo.gitTag'] ]
  jobs:
  - job: CreateGitHubRelease
    displayName: 'Create GitHub Release'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARM64 Packages'
      inputs:
        artifact: 'arm64-packages'
        path: '$(Pipeline.Workspace)/packages/arm64'
        
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARMv7l Packages'
      inputs:
        artifact: 'armv7l-packages'
        path: '$(Pipeline.Workspace)/packages/armv7l'
        
    - script: |
        echo "Verifying downloaded packages..."
        find $(Pipeline.Workspace)/packages -name "*.deb" -exec ls -la {} \;
        
        echo "Creating combined package directory..."
        mkdir -p $(Pipeline.Workspace)/all-packages
        cp $(Pipeline.Workspace)/packages/arm64/*.deb $(Pipeline.Workspace)/all-packages/ || true
        cp $(Pipeline.Workspace)/packages/armv7l/*.deb $(Pipeline.Workspace)/all-packages/ || true
        
        echo "Final package verification..."
        ls -la $(Pipeline.Workspace)/all-packages/
      displayName: 'Prepare Release Packages'
      
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: $(githubConnection)
        repositoryName: $(githubRepository)
        action: 'create'
        target: 'main'
        tagSource: 'userSpecifiedTag'
        tag: '$(gitTag)'
        title: 'MTH BDE IoT Client $(releaseVersion)'
        releaseNotesSource: 'inline'
        isDraft: false
        isPreRelease: false
        addChangeLog: false
        releaseNotesInline: |
          # MTH BDE IoT Client Release $(releaseVersion)
          
          Automatisch generiertes Release für Raspberry Pi
          
          ## Schnell-Installation
          
          ### ARM64 (Raspberry Pi 4, Pi 400, Pi 5)
          ```bash
          wget https://github.com/mthitservice/MTHBDEIOTClient/releases/download/$(gitTag)/mthbdeiotclient_$(releaseVersion)_arm64.deb
          sudo dpkg -i mthbdeiotclient_$(releaseVersion)_arm64.deb
          sudo apt-get install -f
          ```
          
          ### ARMv7l (Raspberry Pi 3, Pi Zero 2 W)
          ```bash
          wget https://github.com/mthitservice/MTHBDEIOTClient/releases/download/$(gitTag)/mthbdeiotclient_$(releaseVersion)_armv7l.deb
          sudo dpkg -i mthbdeiotclient_$(releaseVersion)_armv7l.deb
          sudo apt-get install -f
          ```
          
          ## Abhängigkeiten installieren
          ```bash
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 libuuid1 libsecret-1-0 libgbm1
          ```
          
          ## Nach der Installation
          ```bash
          # Anwendung starten
          mthbdeiotclient
          
          # Als Service starten (optional)
          sudo systemctl enable mthbdeiotclient
          sudo systemctl start mthbdeiotclient
          ```
          
          ## Performance-Optimierungen in $(releaseVersion)
          * Optimierte Maus-Responsivität auf Raspberry Pi
          * Reduzierte Memory-Nutzung (512MB Limit)
          * GPU-Beschleunigung deaktiviert für bessere Stabilität
          * Wayland/X11 Kompatibilität verbessert
          
          ## Systemanforderungen
          * Raspberry Pi 4/5 (ARM64) - 64-bit Raspberry Pi OS
          * Raspberry Pi 3/3+ (ARMv7l) - 32-bit Raspberry Pi OS
          * Mindestens 1GB RAM (2GB+ empfohlen)
          * Desktop-Umgebung (X11/Wayland)
          
          ## Deinstallation
          ```bash
          sudo apt-get remove --purge mthbdeiotclient
          sudo apt-get autoremove
          rm -rf ~/.config/MthBdeIotClient
          rm -rf ~/.local/share/MthBdeIotClient
          ```
          
          **Build Information:**
          * Version: $(releaseVersion)
          * Build: $(Build.BuildNumber)
          * Pipeline: Azure DevOps automatische Release-Generierung
          * Datum: $[format('{0:yyyy-MM-dd HH:mm:ss} UTC', pipeline.startTime)]
          
          *Dieses Release wurde automatisch durch Azure DevOps erstellt und enthält nur die fertigen Anwendungspakete.*
        assets: '$(Pipeline.Workspace)/all-packages/*.deb'
        assetUploadMode: 'replace'

  - job: CleanupOldReleases
    displayName: 'Cleanup Old GitHub Releases'
    dependsOn: CreateGitHubRelease
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    
    - script: |
        echo "=== GITHUB RELEASE CLEANUP ==="
        echo "Cleaning up old releases - keeping last $(keepPatchReleases) patch versions"
        echo "Major versions (x.0.0) and Minor releases (x.Y.0) will be preserved"
        echo "Current release $(gitTag) will be protected"
        echo ""
        
        # GitHub Repository und API Setup
        REPO="$(githubRepository)"
        API_BASE="https://api.github.com"
        
        # GitHub CLI installieren
        echo "Installing GitHub CLI..."
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
        sudo apt update && sudo apt install gh -y
        
        # GitHub Token aus der Service Connection verwenden
        # Das Token wird durch die GitHubRelease Task automatisch verfügbar gemacht
        echo "Setting up GitHub authentication..."
        
        # Alternative: Direkte API Calls mit curl
        echo "Fetching releases via GitHub API..."
        
        # Alle Releases abrufen (erste 100)
        curl -s \
          -H "Accept: application/vnd.github.v3+json" \
          "$API_BASE/repos/$REPO/releases?per_page=100" \
          > releases.json
        
        if [ ! -s releases.json ]; then
            echo "❌ Failed to fetch releases from GitHub API"
            echo "This is non-critical - release was created successfully"
            exit 0
        fi
        
        echo "Releases fetched successfully. Analyzing..."
        
        # Python Script für Release-Analyse und Cleanup-Liste
        python3 << 'EOF'
        import json
        import re
        import sys
        from datetime import datetime
        
        try:
            # Releases laden
            with open('releases.json', 'r') as f:
                releases = json.load(f)
            
            print(f"Found {len(releases)} total releases")
            
            # Nur stabile Releases (nicht Draft, nicht Pre-Release)
            stable_releases = [r for r in releases if not r.get('draft', False) and not r.get('prerelease', False)]
            print(f"Found {len(stable_releases)} stable releases")
            
            # Version parsing und Kategorisierung
            major_releases = []  # x.0.0 Versionen
            minor_releases = []  # x.Y.0 Versionen (Y > 0)
            patch_releases = []  # Alle anderen (x.Y.Z mit Z > 0)
            current_tag = "$(gitTag)"
            
            for release in stable_releases:
                tag = release['tag_name']
                
                # Aktuelles Release schützen
                if tag == current_tag:
                    print(f"🔒 PROTECTED: {tag} (Current Release)")
                    continue
                    
                match = re.match(r'v?(\d+)\.(\d+)\.(\d+)', tag)
                if match:
                    major, minor, patch = map(int, match.groups())
                    version_tuple = (major, minor, patch)
                    
                    # Major Release Detection (x.0.0)
                    if minor == 0 and patch == 0:
                        major_releases.append((release, version_tuple))
                        print(f"🔒 PROTECTED: {tag} (Major Version)")
                    # Minor Release Detection (x.Y.0 with Y > 0)
                    elif patch == 0 and minor > 0:
                        minor_releases.append((release, version_tuple))
                        print(f"🔒 PROTECTED: {tag} (Minor Release)")
                    # Patch Release (x.Y.Z with Z > 0)
                    else:
                        patch_releases.append((release, version_tuple))
            
            # Patch Releases nach Version sortieren (neueste zuerst)
            patch_releases.sort(key=lambda x: x[1], reverse=True)
            
            print(f"\nFound {len(major_releases)} major releases (protected)")
            print(f"Found {len(minor_releases)} minor releases (protected)")
            print(f"Found {len(patch_releases)} patch releases")
            
            # Die letzten X Patch-Releases behalten
            KEEP_PATCHES = $(keepPatchReleases)
            to_keep = patch_releases[:KEEP_PATCHES]
            to_delete = patch_releases[KEEP_PATCHES:]
            
            print(f"\n📦 KEEPING last {KEEP_PATCHES} patch releases:")
            for release, version in to_keep:
                print(f"  ✅ {release['tag_name']} - {release['name']}")
            
            if to_delete:
                print(f"\n🗑️  MARKING {len(to_delete)} old patch releases for deletion:")
                with open('releases_to_delete.json', 'w') as f:
                    delete_list = []
                    for release, version in to_delete:
                        print(f"  ❌ {release['tag_name']} - {release['name']}")
                        delete_list.append({
                            'tag_name': release['tag_name'],
                            'id': release['id'],
                            'name': release['name']
                        })
                    json.dump(delete_list, f, indent=2)
                
                print(f"\nCreated deletion list with {len(delete_list)} releases")
            else:
                print(f"\n✅ No old releases to delete")
                with open('releases_to_delete.json', 'w') as f:
                    json.dump([], f)
                    
        except Exception as e:
            print(f"❌ Error analyzing releases: {e}")
            # Leere Liste erstellen, damit der nachfolgende Schritt nicht fehlschlägt
            with open('releases_to_delete.json', 'w') as f:
                json.dump([], f)
            sys.exit(0)  # Nicht kritisch
        EOF
        
        echo ""
        echo "Analysis completed. Checking deletion list..."
        
        # Prüfen ob Releases zu löschen sind
        DELETE_COUNT=$(cat releases_to_delete.json | jq '. | length')
        
        if [ "$DELETE_COUNT" -gt 0 ]; then
            echo "Found $DELETE_COUNT releases to delete"
            echo "⚠️  Deletion would be performed here if GitHub token was available"
            echo ""
            echo "To enable automatic cleanup, configure a GitHub Personal Access Token"
            echo "in Azure DevOps as a pipeline variable named 'GITHUB_TOKEN'"
            echo ""
            echo "Releases marked for deletion:"
            cat releases_to_delete.json | jq -r '.[] | "  ❌ \(.tag_name) - \(.name)"'
        else
            echo "✅ No releases need to be deleted"
        fi
        
        echo ""
        echo "=== CLEANUP SUMMARY ==="
        echo "• Major versions (x.0.0): PROTECTED - never deleted"
        echo "• Minor releases (x.Y.0): PROTECTED - never deleted"
        echo "• Patch versions: Keep last $(keepPatchReleases), mark older ones for deletion"
        echo "• Current release $(gitTag): PROTECTED as newest"
        echo "• Note: Automatic deletion requires GitHub token configuration"
        
      displayName: 'Analyze Old GitHub Releases'

  - job: CleanupPipelineArtifacts
    displayName: 'Cleanup Old Pipeline Artifacts'
    dependsOn: CreateGitHubRelease
    condition: succeeded()
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    
    - task: PowerShell@2
      displayName: 'Cleanup Old Pipeline Artifacts'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "=== AZURE PIPELINE ARTIFACTS CLEANUP ==="
          Write-Host "Cleaning up old pipeline builds - keeping last $(keepPipelineBuilds) builds"
          Write-Host ""
          
          try {
              # Azure DevOps REST API Setup
              $organization = "$(System.TeamFoundationCollectionUri)".TrimEnd('/')
              $project = "$(System.TeamProject)"
              $buildDefinitionId = "$(System.DefinitionId)"
              
              $headers = @{
                  "Authorization" = "Bearer $(System.AccessToken)"
                  "Content-Type" = "application/json"
              }
              
              Write-Host "Organization: $organization"
              Write-Host "Project: $project"
              Write-Host "Build Definition ID: $buildDefinitionId"
              Write-Host ""
              
              # Alle Builds dieser Pipeline abrufen
              $apiUrl = "$organization/$project/_apis/build/builds?definitions=$buildDefinitionId&`$top=100&api-version=7.0"
              Write-Host "Fetching builds from: $apiUrl"
              
              $builds = Invoke-RestMethod -Uri $apiUrl -Headers $headers -Method Get
              
              Write-Host "Found $($builds.count) total builds for this pipeline"
              
              # Nur erfolgreich abgeschlossene Builds
              $completedBuilds = $builds.value | Where-Object { 
                  $_.status -eq "completed" -and $_.result -eq "succeeded" 
              } | Sort-Object finishTime -Descending
              
              Write-Host "Found $($completedBuilds.Count) successfully completed builds"
              
              # Builds zu behalten und zu löschen
              $keepCount = $(keepPipelineBuilds)
              $buildsToKeep = $completedBuilds | Select-Object -First $keepCount
              $buildsToDelete = $completedBuilds | Select-Object -Skip $keepCount
              
              Write-Host ""
              Write-Host "📦 KEEPING last $keepCount builds:" -ForegroundColor Green
              foreach ($build in $buildsToKeep) {
                  $buildNumber = $build.buildNumber
                  $finishTime = $build.finishTime
                  Write-Host "  ✅ Build $buildNumber (Finished: $finishTime)" -ForegroundColor Green
              }
              
              if ($buildsToDelete.Count -gt 0) {
                  Write-Host ""
                  Write-Host "🗑️  DELETING $($buildsToDelete.Count) old builds:" -ForegroundColor Red
                  
                  foreach ($build in $buildsToDelete) {
                      $buildId = $build.id
                      $buildNumber = $build.buildNumber
                      $finishTime = $build.finishTime
                      
                      Write-Host "  ❌ Deleting Build $buildNumber (ID: $buildId, Finished: $finishTime)" -ForegroundColor Red
                      
                      try {
                          # Build löschen
                          $deleteUrl = "$organization/$project/_apis/build/builds/$buildId" + "?api-version=7.0"
                          Invoke-RestMethod -Uri $deleteUrl -Headers $headers -Method Delete
                          
                          Write-Host "    ✅ Successfully deleted build $buildNumber" -ForegroundColor Green
                          
                          # Rate limiting vermeiden
                          Start-Sleep -Seconds 1
                          
                      } catch {
                          Write-Host "    ❌ Failed to delete build $buildNumber : $($_.Exception.Message)" -ForegroundColor Red
                      }
                  }
                  
                  Write-Host ""
                  Write-Host "✅ Pipeline cleanup completed!" -ForegroundColor Green
              } else {
                  Write-Host ""
                  Write-Host "✅ No cleanup needed - less than $keepCount builds found" -ForegroundColor Green
              }
              
              Write-Host ""
              Write-Host "=== PIPELINE CLEANUP SUMMARY ===" -ForegroundColor Cyan
              Write-Host "• Total builds found: $($builds.count)" -ForegroundColor Yellow
              Write-Host "• Successful builds: $($completedBuilds.Count)" -ForegroundColor Yellow
              Write-Host "• Builds kept: $($buildsToKeep.Count)" -ForegroundColor Green
              Write-Host "• Builds deleted: $($buildsToDelete.Count)" -ForegroundColor Red
              Write-Host "• Current build $(Build.BuildNumber): PROTECTED as current" -ForegroundColor Green
              
          } catch {
              Write-Host "❌ Error during pipeline cleanup: $($_.Exception.Message)" -ForegroundColor Red
              Write-Host "This is non-critical - release was created successfully" -ForegroundColor Yellow
              # Nicht die gesamte Pipeline zum Scheitern bringen
          }
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
