# Azure DevOps Pipeline für MthBdeIotClient - Raspberry Pi Multi-Architecture Build
# Automatische Tag-Erstellung und GitHub Release ohne Quellcode-Push

trigger:
  branches:
    include:
      - "master"  # Trigger auf master branch commits (Azure DevOps Quellcode)
  tags:
    exclude:
      - "*"  # Keine Tag-Trigger (Tags werden automatisch erstellt)

# Deaktiviere Pull Request Triggers  
pr: none

variables:
  # Build-Konfiguration
  buildConfiguration: "Release"
  nodeVersion: "22.x"
  
  # Versioning - wird automatisch aus package.json gelesen
  isRelease: true  # Immer als Release behandeln
  
  # Artifact Names
  artifactName: "MthBdeIotClient-RaspberryPi"
  
  # GitHub Configuration (nur für Releases, nicht für Quellcode)
  githubRepository: "mthitservice/MTHBDEIOTClient"
  githubConnection: "github-connection"

stages:
  - stage: VersionAndTag
    displayName: "Version Detection and Git Tag Creation"
    jobs:
      - job: CreateGitTag
        displayName: "Read Version and Create Git Tag"
        pool:
          vmImage: "ubuntu-latest"
        
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true
            displayName: "Checkout Source Code"

          - task: NodeTool@0
            displayName: "Install Node.js $(nodeVersion)"
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              cd App
              echo "=== READING VERSION FROM PACKAGE.JSON ==="
              
              # Version aus package.json auslesen
              VERSION=$(node -p "require('./package.json').version")
              echo "Detected version: $VERSION"
              
              # Prüfen ob Version gültig ist
              if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "❌ Invalid version format: $VERSION"
                exit 1
              fi
              
              # Git Tag erstellen
              GIT_TAG="v$VERSION"
              echo "Creating Git tag: $GIT_TAG"
              
              # Prüfen ob Tag bereits existiert
              if git rev-parse "$GIT_TAG" >/dev/null 2>&1; then
                echo "⚠️ Tag $GIT_TAG already exists, will update release"
                echo "##vso[task.setvariable variable=releaseVersion;isOutput=true]$VERSION"
                echo "##vso[task.setvariable variable=gitTag;isOutput=true]$GIT_TAG"
                echo "##vso[task.setvariable variable=tagExists;isOutput=true]true"
              else
                echo "✅ Creating new tag $GIT_TAG"
                
                # Git Konfiguration
                git config user.name "Azure DevOps Pipeline"
                git config user.email "pipeline@mth-it-service.com"
                
                # Tag mit Nachricht erstellen (escaped für YAML)
                TAG_MESSAGE="Release $VERSION - MTH BDE IoT Client Release v$VERSION - Features: Electron App für Raspberry Pi - Performance-Optimierungen für bessere Maus-Responsivität - Build: $(Build.BuildNumber) - Commit: $(Build.SourceVersion)"

                git tag -a "$GIT_TAG" -m "$TAG_MESSAGE"
                
                echo "##vso[task.setvariable variable=releaseVersion;isOutput=true]$VERSION"
                echo "##vso[task.setvariable variable=gitTag;isOutput=true]$GIT_TAG"
                echo "##vso[task.setvariable variable=tagExists;isOutput=true]false"
                
                echo "✅ Git tag $GIT_TAG created successfully"
              fi
            displayName: "Create Git Tag from Package Version"
            name: versionInfo

  - stage: Build
    displayName: "Build Raspberry Pi Applications"
    dependsOn: VersionAndTag
    variables:
      releaseVersion: $[ stageDependencies.VersionAndTag.CreateGitTag.outputs['versionInfo.releaseVersion'] ]
      gitTag: $[ stageDependencies.VersionAndTag.CreateGitTag.outputs['versionInfo.gitTag'] ]
    jobs:
      - job: BuildRaspberryPiARM64
        displayName: "Build Raspberry Pi 64-bit (ARM64)"
        pool:
          vmImage: "ubuntu-latest"
        
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true
            displayName: "Checkout Source Code"

          - task: NodeTool@0
            displayName: "Install Node.js $(nodeVersion)"
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: "Cache node modules"
            inputs:
              key: 'npm | "$(Agent.OS)" | App/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: App/node_modules

          - script: |
              cd App
              echo "=== SYSTEM INFORMATION ==="
              echo "Node version: $(node --version)"
              echo "NPM version: $(npm --version)"
              echo "Working directory: $(pwd)"
              echo "Target: Raspberry Pi 64-bit (ARM64)"
              
              echo "=== NPM CONFIGURATION ==="
              npm config set fund false
              npm config set audit false
              npm config set progress false
            displayName: "System Information & NPM Setup"

          - script: |
              cd App
              echo "=== INSTALLING DEPENDENCIES ==="
              npm ci --ignore-scripts --no-audit --no-fund
              
              echo "=== VERIFYING CRITICAL PACKAGES ==="
              echo "electron-builder: $(npx electron-builder --version)"
              echo "Dependencies installed successfully"
            displayName: "Install Dependencies"
            timeoutInMinutes: 10

          - script: |
              cd App
              echo "=== SETTING VERSION ==="
              
              # Version aus Tag oder automatisch generieren
              if [ "$ISRELEASE" = "True" ]; then
                VERSION="$RELEASEVERSION"
                echo "Release Version: $VERSION"
              else
                BUILD_NUMBER="$BUILD_BUILDNUMBER"
                SHORT_COMMIT=$(echo "$BUILD_SOURCEVERSION" | cut -c1-7)
                VERSION="1.0.0-dev.$BUILD_NUMBER+$SHORT_COMMIT"
                echo "Development Version: $VERSION"
              fi

              # Environment Variables setzen
              echo "##vso[task.setvariable variable=APP_VERSION]$VERSION"
              echo "##vso[task.setvariable variable=VERSION]$VERSION"

              # Package.json Version aktualisieren
              node -e "
                const fs = require('fs');
                const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                packageJson.version = '$VERSION';
                fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2));
                console.log('Updated package.json version to: $VERSION');
              "
              
              # .env Datei mit allen Variablen erstellen
              echo \"NODE_ENV=production\" > .env
              echo \"APP_VERSION=$VERSION\" >> .env
              echo \"VERSION=$VERSION\" >> .env
              echo \"APP_NAME=MTH BDE IOT Client\" >> .env
              echo \"APP_COPYRIGHT=MTH-IT-SERVICE\" >> .env
              echo \"APP_AUTHOR=Michael Lindner\" >> .env
              echo \"APP_DESCRIPTION=Anwendung zum Erfassen von Betriebsdaten\" >> .env
              echo \"DB_NAME=bde.sqlite\" >> .env
              
              echo "Environment variables set:"
              cat .env
              
              echo "Version set to: $VERSION"
            displayName: "Set Application Version"

          - script: |
              cd App
              echo "=== BUILDING APPLICATION ==="
              
              export NODE_ENV=production
              export APP_VERSION=$(APP_VERSION)
              export ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES=true
              
              npm run build:main
              npm run build:renderer
              
              echo "Application build completed successfully"
            displayName: "Build Application"

          - script: |
              cd App
              echo "=== PACKAGING RASPBERRY PI ARM64 DEB ==="
              
              export NODE_ENV=production
              export APP_VERSION=$(APP_VERSION)
              export ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES=true
              export ELECTRON_BUILDER_CACHE_DIR=/tmp/.electron-builder-cache
              
              # Erstelle .env file für ARM64 mit Raspberry Pi Optimierungen
              echo "NODE_ENV=production" > .env
              echo "APP_VERSION=$(APP_VERSION)" >> .env
              echo "ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES=true" >> .env
              echo "RASPBERRY_PI=true" >> .env
              
              echo "Building ARM64 DEB package with performance optimizations..."
              NODE_OPTIONS="--max-old-space-size=512" npx electron-builder build --linux deb --arm64 --publish never
              
              echo "=== PACKAGE VALIDATION ==="
              for debfile in $(find . -name "*arm64*.deb" -o -name "*aarch64*.deb"); do
                if [ -f "$debfile" ]; then
                  echo "Found ARM64 package: $debfile"
                  size=$(stat -c%s "$debfile")
                  echo "  Size: $size bytes ($(echo "scale=2; $size/1024/1024" | bc) MB)"
                  
                  if dpkg-deb --info "$debfile" > /dev/null 2>&1; then
                    echo "  ✅ Valid DEB package"
                    echo "  Architecture: $(dpkg-deb --field "$debfile" Architecture)"
                  else
                    echo "  ❌ Invalid DEB package"
                  fi
                fi
              done
              
              echo "ARM64 packaging completed"
            displayName: "Package Raspberry Pi ARM64 DEB"

          - task: CopyFiles@2
            displayName: "Copy ARM64 Packages"
            inputs:
              sourceFolder: "App/release"
              contents: "**/*arm64*.deb"
              targetFolder: "$(Build.ArtifactStagingDirectory)/arm64"
              flattenFolders: false

          - task: PublishBuildArtifacts@1
            displayName: "Publish ARM64 Artifacts"
            inputs:
              pathToPublish: "$(Build.ArtifactStagingDirectory)/arm64"
              artifactName: "arm64-packages"
              publishLocation: "Container"

      - job: BuildRaspberryPiARMv7l
        displayName: "Build Raspberry Pi 32-bit (ARMv7l)"
        dependsOn: BuildRaspberryPiARM64
        pool:
          vmImage: "ubuntu-latest"
        
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true
            displayName: "Checkout Source Code"

          - task: NodeTool@0
            displayName: "Install Node.js $(nodeVersion)"
            inputs:
              versionSpec: $(nodeVersion)

          - task: Cache@2
            displayName: "Cache node modules"
            inputs:
              key: 'npm | "$(Agent.OS)" | App/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: App/node_modules

          - script: |
              cd App
              echo "=== SYSTEM INFORMATION ==="
              echo "Node version: $(node --version)"
              echo "NPM version: $(npm --version)"
              echo "Target: Raspberry Pi 32-bit (ARMv7l)"
              
              echo "=== NPM CONFIGURATION ==="
              npm config set fund false
              npm config set audit false
              npm config set progress false
            displayName: "System Information & NPM Setup"

          - script: |
              cd App
              echo "=== INSTALLING DEPENDENCIES ==="
              npm ci --ignore-scripts --no-audit --no-fund
              
              echo "=== VERIFYING CRITICAL PACKAGES ==="
              echo "electron-builder: $(npx electron-builder --version)"
              echo "Dependencies installed successfully"
            displayName: "Install Dependencies"
            timeoutInMinutes: 10

          - script: |
              cd App
              echo "=== SETTING VERSION ==="
              
              # Version aus Tag oder automatisch generieren
              if [ "$ISRELEASE" = "True" ]; then
                VERSION="$RELEASEVERSION"
                echo "Release Version: $VERSION"
              else
                BUILD_NUMBER="$BUILD_BUILDNUMBER"
                SHORT_COMMIT=$(echo "$BUILD_SOURCEVERSION" | cut -c1-7)
                VERSION="1.0.0-dev.$BUILD_NUMBER+$SHORT_COMMIT"
                echo "Development Version: $VERSION"
              fi

              # Environment Variables setzen
              echo "##vso[task.setvariable variable=APP_VERSION]$VERSION"

              # Package.json Version aktualisieren
              node -e "
                const fs = require('fs');
                const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                packageJson.version = '$VERSION';
                fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2));
                console.log('Updated package.json version to: $VERSION');
              "
              
              echo "Version set to: $VERSION"
            displayName: "Set Application Version"

          - script: |
              cd App
              echo "=== BUILDING APPLICATION ==="
              
              export NODE_ENV=production
              export APP_VERSION=$(APP_VERSION)
              export ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES=true
              
              npm run build:main
              npm run build:renderer
              
              echo "Application build completed successfully"
            displayName: "Build Application"

          - script: |
              cd App
              echo "=== PACKAGING RASPBERRY PI ARMv7l DEB ==="
              
              export NODE_ENV=production
              export APP_VERSION=$(APP_VERSION)
              export ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES=true
              export ELECTRON_BUILDER_CACHE_DIR=/tmp/.electron-builder-cache
              
              # Erstelle .env file für ARMv7l mit Raspberry Pi Optimierungen
              echo "NODE_ENV=production" > .env
              echo "APP_VERSION=$(APP_VERSION)" >> .env
              echo "ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES=true" >> .env
              echo "RASPBERRY_PI=true" >> .env
              
              echo "Building ARMv7l DEB package with performance optimizations..."
              NODE_OPTIONS="--max-old-space-size=512" npx electron-builder build --linux deb --armv7l --publish never
              
              echo "=== PACKAGE VALIDATION ==="
              for debfile in $(find . -name "*armv7l*.deb"); do
                if [ -f "$debfile" ]; then
                  echo "Found ARMv7l package: $debfile"
                  size=$(stat -c%s "$debfile")
                  echo "  Size: $size bytes ($(echo "scale=2; $size/1024/1024" | bc) MB)"
                  
                  if dpkg-deb --info "$debfile" > /dev/null 2>&1; then
                    echo "  ✅ Valid DEB package"
                    echo "  Architecture: $(dpkg-deb --field "$debfile" Architecture)"
                  else
                    echo "  ❌ Invalid DEB package"
                  fi
                fi
              done
              
              echo "ARMv7l packaging completed"
            displayName: "Package Raspberry Pi ARMv7l DEB"

          - task: CopyFiles@2
            displayName: "Copy ARMv7l Packages"
            inputs:
              sourceFolder: "App/release"
              contents: "**/*armv7l*.deb"
              targetFolder: "$(Build.ArtifactStagingDirectory)/armv7l"
              flattenFolders: false

          - task: PublishBuildArtifacts@1
            displayName: "Publish ARMv7l Artifacts"
            inputs:
              pathToPublish: "$(Build.ArtifactStagingDirectory)/armv7l"
              artifactName: "armv7l-packages"
              publishLocation: "Container"

      - job: CombineArtifacts
        displayName: "Combine All Packages"
        dependsOn: 
          - BuildRaspberryPiARM64
          - BuildRaspberryPiARMv7l
        pool:
          vmImage: "ubuntu-latest"
        
        steps:
          - download: current
            artifact: arm64-packages
            displayName: "Download ARM64 Packages"

          - download: current
            artifact: armv7l-packages
            displayName: "Download ARMv7l Packages"

          - script: |
              echo "=== DOWNLOADED ARTIFACTS OVERVIEW ==="
              echo "Pipeline workspace contents:"
              find $(Pipeline.Workspace) -type f -exec ls -lh {} \;
            displayName: "Show Downloaded Artifacts"

          - task: CopyFiles@2
            displayName: "Copy All Packages to Combined Folder"
            inputs:
              sourceFolder: "$(Pipeline.Workspace)"
              contents: "**/*.deb"
              targetFolder: "$(Build.ArtifactStagingDirectory)/packages"
              flattenFolders: true

          - script: |
              echo "=== FINAL PACKAGE VERIFICATION ==="
              echo "Staging directory contents:"
              find $(Build.ArtifactStagingDirectory) -type f -exec ls -lh {} \;
              
              echo "=== PACKAGE SUMMARY ==="
              deb_count=$(find $(Build.ArtifactStagingDirectory) -name "*.deb" | wc -l)
              echo "DEB packages found: $deb_count"
              
              if [ $deb_count -gt 0 ]; then
                echo "✅ Raspberry Pi packages created successfully"
                
                # ARM64 Packages
                arm64_count=$(find $(Build.ArtifactStagingDirectory) -name "*arm64*.deb" -o -name "*aarch64*.deb" | wc -l)
                echo "🍓 ARM64 packages: $arm64_count"
                find $(Build.ArtifactStagingDirectory) -name "*arm64*.deb" -o -name "*aarch64*.deb" -exec basename {} \;
                
                # ARMv7l Packages
                armv7l_count=$(find $(Build.ArtifactStagingDirectory) -name "*armv7l*.deb" | wc -l)
                echo "🍓 ARMv7l packages: $armv7l_count"
                find $(Build.ArtifactStagingDirectory) -name "*armv7l*.deb" -exec basename {} \;
                
              else
                echo "❌ No DEB packages found"
                echo "Available files:"
                find $(Build.ArtifactStagingDirectory) -type f
              fi
            displayName: "Verify Combined Packages"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Raspberry Pi Artifacts"
            inputs:
              pathToPublish: "$(Build.ArtifactStagingDirectory)"
              artifactName: $(artifactName)
              publishLocation: "Container"
            condition: always()

  - stage: Deploy
    displayName: "Deploy & GitHub Release"
    dependsOn: 
      - VersionAndTag
      - Build
    condition: succeeded()
    variables:
      releaseVersion: $[ stageDependencies.VersionAndTag.CreateGitTag.outputs['versionInfo.releaseVersion'] ]
      gitTag: $[ stageDependencies.VersionAndTag.CreateGitTag.outputs['versionInfo.gitTag'] ]
    jobs:
      - job: CreateGitHubRelease
        displayName: "Create GitHub Release with Artifacts Only"
        pool:
          vmImage: "ubuntu-latest"
        
        steps:
          - task: DownloadPipelineArtifact@2
            displayName: "Download Build Artifacts"
            inputs:
              artifact: $(artifactName)
              path: "$(Pipeline.Workspace)/$(artifactName)"

          - script: |
              echo "=== DOWNLOADED ARTIFACTS VERIFICATION ==="
              echo "Workspace contents:"
              find $(Pipeline.Workspace) -name "*.deb" -exec ls -lh {} \;
              
              deb_count=$(find $(Pipeline.Workspace) -name "*.deb" | wc -l)
              echo "DEB packages found: $deb_count"
              
              if [ $deb_count -eq 0 ]; then
                echo "❌ No DEB packages found for GitHub Release"
                echo "Available files in workspace:"
                find $(Pipeline.Workspace) -type f
                exit 1
              else
                echo "✅ Found $deb_count DEB packages for release"
              fi
            displayName: "Verify Downloaded Artifacts"

          - task: GitHubRelease@1
            displayName: "Create GitHub Release with Auto-Generated Tag"
            inputs:
              gitHubConnection: $(githubConnection)
              repositoryName: $(githubRepository)
              action: "create"
              target: "$(Build.SourceVersion)"  # Commit Hash statt Branch
              tagSource: "userSpecifiedTag"
              tag: "$(gitTag)"  # Verwende automatisch erstellten Tag
              title: "MthBdeIotClient $(releaseVersion)"
              releaseNotesSource: "inline"
              releaseNotesInline: |
                ## 🚀 MTH BDE IoT Client Release $(releaseVersion)
                
                **Automatisch generiert durch Azure DevOps Pipeline**
                
                ### 📦 Download-Links
                
                #### Direkte wget-Befehle:
                ```bash
                # ARM64 (Raspberry Pi 4, Pi 400, Pi 5)
                wget https://github.com/mthitservice/MTHBDEIOTClient/releases/download/$(gitTag)/mthbdeiotclient_$(releaseVersion)_arm64.deb
                
                # ARMv7l (Raspberry Pi 3, Pi Zero 2 W)  
                wget https://github.com/mthitservice/MTHBDEIOTClient/releases/download/$(gitTag)/mthbdeiotclient_$(releaseVersion)_armv7l.deb
                ```
                
                #### 📋 Verfügbare Pakete:
                - **Raspberry Pi 64-bit (ARM64)**: `mthbdeiotclient_$(releaseVersion)_arm64.deb`
                - **Raspberry Pi 32-bit (ARMv7l)**: `mthbdeiotclient_$(releaseVersion)_armv7l.deb`
                
                ### 🔧 Schnell-Installation
                ```bash
                # 1. Abhängigkeiten installieren
                sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 libuuid1 libsecret-1-0 libgbm1
                
                # 2. DEB Package installieren (ARM64)
                sudo dpkg -i mthbdeiotclient_$(releaseVersion)_arm64.deb && sudo apt-get install -f
                
                # 3. Anwendung starten
                mthbdeiotclient
                ```
                
                ### ⚡ Performance-Verbesserungen in $(releaseVersion)
                - Optimierte Maus-Responsivität auf Raspberry Pi
                - Reduzierte Memory-Nutzung (512MB Limit)
                - GPU-Beschleunigung deaktiviert für bessere Stabilität
                - Wayland/X11 Kompatibilität verbessert
                
                ### 🖥️ Systemanforderungen
                - **Raspberry Pi 4/5 (ARM64)**: 64-bit Raspberry Pi OS
                - **Raspberry Pi 3/3+ (ARMv7l)**: 32-bit Raspberry Pi OS  
                - **Mindestens 1GB RAM** (2GB+ empfohlen)
                - **Desktop-Umgebung** (X11/Wayland)
                
                ### 🔗 Build Information
                - **Build**: $(Build.BuildNumber)
                - **Commit**: $(Build.SourceVersion)
                - **Pipeline**: Automatische Release-Generierung
                - **Datum**: $[format('{0:yyyy-MM-dd HH:mm:ss} UTC', pipeline.startTime)]
                
                ---
                *Dieses Release wurde automatisch durch Azure DevOps erstellt und enthält nur die fertigen Anwendungspakete.*
                sudo apt-get install -f
                
                # ODER für ARMv7l:
                # sudo dpkg -i mthbdeiotclient_$(releaseVersion)_armv7l.deb
                # sudo apt-get install -f
                
                # 3. Anwendung starten
                mthbdeiotclient
                ```
                
                ### �️ Deinstallation
                ```bash
                # Anwendung vollständig entfernen
                sudo apt-get remove --purge mthbdeiotclient
                sudo apt-get autoremove
                
                # Benutzerdaten löschen (optional)
                rm -rf ~/.config/MthBdeIotClient
                rm -rf ~/.local/share/MthBdeIotClient
                ```
                
                ### �🖥️ Kiosk-Modus
                ```bash
                # Autostart für Kiosk-Modus konfigurieren
                sudo nano /etc/xdg/lxsession/LXDE-pi/autostart
                
                # Diese Zeilen am Ende hinzufügen:
                @xset s off
                @xset -dpms  
                @xset s noblank
                @mthbdeiotclient --fullscreen
                
                # Oder für Wayland/moderne Desktop-Umgebungen:
                # ~/.config/autostart/mthbdeiotclient.desktop erstellen
                ```
                
                ### 🔧 Problembehandlung
                ```bash
                # Bei Problemen: Logs anzeigen
                journalctl --user -u mthbdeiotclient.service -f
                
                # Datenbank-Berechtigungen reparieren (falls nötig)
                sudo chown -R $USER:$USER ~/.local/share/MthBdeIotClient
                sudo chmod -R 755 ~/.local/share/MthBdeIotClient
                
                # X11-Display für SSH-Verbindungen
                export DISPLAY=:0
                mthbdeiotclient
                ```
                
                ### 📋 Systemanforderungen
                - **Raspberry Pi 4/5 (ARM64)**: 64-bit Raspberry Pi OS (empfohlen)
                - **Raspberry Pi 3/3+ (ARMv7l)**: 32-bit Raspberry Pi OS  
                - **Mindestens 1GB RAM** (2GB+ empfohlen)
                - **Desktop-Umgebung** (X11/Wayland)
                - **Internetverbindung** für Updates
                
                ### 📋 Changelog
                Automatisierte Release von Tag $(Build.SourceBranchName)
                
                **Build Information:**
                - **Build**: $(Build.BuildNumber)
                - **Commit**: $(Build.SourceVersion)
                - **Datum**: $[format('{0:yyyy-MM-dd HH:mm:ss} UTC', pipeline.startTime)]
              assets: |
                $(Pipeline.Workspace)/$(artifactName)/packages/*.deb
              assetUploadMode: "replace"
              isDraft: false
              isPreRelease: false
              addChangeLog: false
