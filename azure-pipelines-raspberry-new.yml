# Azure DevOps Pipeline für MTH BDE IoT Client - Raspberry Pi Release
# Automatisch bei Git Tags gestartet (v*)

# Pipeline startet nur bei neuen Git Tags
resources:
  repositories:
  - repository: self
    type: git
    ref: refs/heads/master

# Trigger nur bei Tags
pr: none
trigger:
  branches:
    exclude:
    - "*"  # Keine Branch-Triggers
  tags:
    include:
    - "v*"  # Nur bei Tags die mit 'v' beginnen

variables:
  # Global Variables
  artifactName: 'RaspberryPiReleases'
  buildConfiguration: 'production'
  nodeVersion: '20.x'
  
  # GitHub Configuration
  githubRepository: 'mthitservice/MTHBDEIOTClient'
  githubConnection: 'github-mthitservice'  # Muss in Azure DevOps konfiguriert sein

stages:
# =============================================================================
# STAGE 1: Version Detection
# =============================================================================
- stage: VersionDetection
  displayName: 'Detect Version from Git Tag'
  jobs:
  - job: DetectVersion
    displayName: 'Extract Version from Git Tag'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      fetchDepth: 1
      
    - task: PowerShell@2
      displayName: 'Extract Version from Git Tag'
      inputs:
        targetType: 'inline'
        script: |
          # Git Tag auslesen (z.B. v1.0.47 -> 1.0.47)
          $gitTag = "$(Build.SourceBranch)"
          Write-Host "Git Source Branch: $gitTag"
          
          if ($gitTag -match "refs/tags/v(.+)") {
              $version = $matches[1]
              Write-Host "Extracted Version: $version"
              Write-Host "##vso[task.setvariable variable=releaseVersion;isOutput=true]$version"
              Write-Host "##vso[task.setvariable variable=gitTag;isOutput=true]v$version"
          } else {
              Write-Error "No valid version tag found in: $gitTag"
              exit 1
          }
      name: 'versionInfo'

# =============================================================================
# STAGE 2: Build Raspberry Pi Packages
# =============================================================================
- stage: BuildRaspberryPi
  displayName: 'Build Raspberry Pi Packages'
  dependsOn: VersionDetection
  variables:
    releaseVersion: $[ stageDependencies.VersionDetection.DetectVersion.outputs['versionInfo.releaseVersion'] ]
    gitTag: $[ stageDependencies.VersionDetection.DetectVersion.outputs['versionInfo.gitTag'] ]
  jobs:
  
  # ARM64 Build (Raspberry Pi 4, Pi 5)
  - job: BuildARM64
    displayName: 'Build ARM64 (Raspberry Pi 4/5)'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      submodules: true
      
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: $(nodeVersion)
        
    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | App/package-lock.json'
        restoreKeys: 'npm | "$(Agent.OS)"'
        path: 'App/node_modules'
        
    - script: |
        cd App
        echo "Installing dependencies..."
        npm ci --production=false
        
        echo "Setting version to $(releaseVersion)"
        npm version $(releaseVersion) --no-git-tag-version --allow-same-version
        
        echo "Building ARM64 package..."
        npm run package:raspberry-optimized -- --arch=arm64
        
        echo "Creating output directory..."
        mkdir -p $(Build.ArtifactStagingDirectory)/arm64
        
        echo "Copying ARM64 package..."
        find release -name "*.deb" -path "*/make/deb/arm64/*" -exec cp {} $(Build.ArtifactStagingDirectory)/arm64/ \;
        
        echo "Verifying ARM64 package..."
        ls -la $(Build.ArtifactStagingDirectory)/arm64/
      displayName: 'Build ARM64 Package'
      
    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARM64 Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/arm64'
        artifact: 'arm64-packages'

  # ARMv7l Build (Raspberry Pi 3)
  - job: BuildARMv7l
    displayName: 'Build ARMv7l (Raspberry Pi 3)'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
      submodules: true
      
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: $(nodeVersion)
        
    - task: Cache@2
      displayName: 'Cache node_modules'
      inputs:
        key: 'npm | "$(Agent.OS)" | App/package-lock.json'
        restoreKeys: 'npm | "$(Agent.OS)"'
        path: 'App/node_modules'
        
    - script: |
        cd App
        echo "Installing dependencies..."
        npm ci --production=false
        
        echo "Setting version to $(releaseVersion)"
        npm version $(releaseVersion) --no-git-tag-version --allow-same-version
        
        echo "Building ARMv7l package..."
        npm run package:raspberry-optimized -- --arch=armv7l
        
        echo "Creating output directory..."
        mkdir -p $(Build.ArtifactStagingDirectory)/armv7l
        
        echo "Copying ARMv7l package..."
        find release -name "*.deb" -path "*/make/deb/armv7l/*" -exec cp {} $(Build.ArtifactStagingDirectory)/armv7l/ \;
        
        echo "Verifying ARMv7l package..."
        ls -la $(Build.ArtifactStagingDirectory)/armv7l/
      displayName: 'Build ARMv7l Package'
      
    - task: PublishPipelineArtifact@1
      displayName: 'Publish ARMv7l Artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/armv7l'
        artifact: 'armv7l-packages'

# =============================================================================
# STAGE 3: Deploy to GitHub
# =============================================================================
- stage: Deploy
  displayName: 'Deploy to GitHub'
  dependsOn: 
  - VersionDetection
  - BuildRaspberryPi
  variables:
    releaseVersion: $[ stageDependencies.VersionDetection.DetectVersion.outputs['versionInfo.releaseVersion'] ]
    gitTag: $[ stageDependencies.VersionDetection.DetectVersion.outputs['versionInfo.gitTag'] ]
  jobs:
  - job: CreateGitHubRelease
    displayName: 'Create GitHub Release'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: none
    
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARM64 Packages'
      inputs:
        artifact: 'arm64-packages'
        path: '$(Pipeline.Workspace)/packages/arm64'
        
    - task: DownloadPipelineArtifact@2
      displayName: 'Download ARMv7l Packages'
      inputs:
        artifact: 'armv7l-packages'
        path: '$(Pipeline.Workspace)/packages/armv7l'
        
    - script: |
        echo "Verifying downloaded packages..."
        find $(Pipeline.Workspace)/packages -name "*.deb" -exec ls -la {} \;
        
        echo "Creating combined package directory..."
        mkdir -p $(Pipeline.Workspace)/all-packages
        cp $(Pipeline.Workspace)/packages/arm64/*.deb $(Pipeline.Workspace)/all-packages/ || true
        cp $(Pipeline.Workspace)/packages/armv7l/*.deb $(Pipeline.Workspace)/all-packages/ || true
        
        echo "Final package verification..."
        ls -la $(Pipeline.Workspace)/all-packages/
      displayName: 'Prepare Release Packages'
      
    - task: GitHubRelease@1
      displayName: 'Create GitHub Release'
      inputs:
        gitHubConnection: $(githubConnection)
        repositoryName: $(githubRepository)
        action: 'create'
        target: 'main'
        tagSource: 'userSpecifiedTag'
        tag: '$(gitTag)'
        title: 'MTH BDE IoT Client $(releaseVersion)'
        releaseNotesSource: 'inline'
        isDraft: false
        isPreRelease: false
        addChangeLog: false
        releaseNotesInline: |
          # MTH BDE IoT Client Release $(releaseVersion)
          
          Automatisch generiertes Release für Raspberry Pi
          
          ## Schnell-Installation
          
          ### ARM64 (Raspberry Pi 4, Pi 400, Pi 5)
          ```bash
          wget https://github.com/mthitservice/MTHBDEIOTClient/releases/download/$(gitTag)/mthbdeiotclient_$(releaseVersion)_arm64.deb
          sudo dpkg -i mthbdeiotclient_$(releaseVersion)_arm64.deb
          sudo apt-get install -f
          ```
          
          ### ARMv7l (Raspberry Pi 3, Pi Zero 2 W)
          ```bash
          wget https://github.com/mthitservice/MTHBDEIOTClient/releases/download/$(gitTag)/mthbdeiotclient_$(releaseVersion)_armv7l.deb
          sudo dpkg -i mthbdeiotclient_$(releaseVersion)_armv7l.deb
          sudo apt-get install -f
          ```
          
          ## Abhängigkeiten installieren
          ```bash
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 libuuid1 libsecret-1-0 libgbm1
          ```
          
          ## Nach der Installation
          ```bash
          # Anwendung starten
          mthbdeiotclient
          
          # Als Service starten (optional)
          sudo systemctl enable mthbdeiotclient
          sudo systemctl start mthbdeiotclient
          ```
          
          ## Performance-Optimierungen in $(releaseVersion)
          * Optimierte Maus-Responsivität auf Raspberry Pi
          * Reduzierte Memory-Nutzung (512MB Limit)
          * GPU-Beschleunigung deaktiviert für bessere Stabilität
          * Wayland/X11 Kompatibilität verbessert
          
          ## Systemanforderungen
          * Raspberry Pi 4/5 (ARM64) - 64-bit Raspberry Pi OS
          * Raspberry Pi 3/3+ (ARMv7l) - 32-bit Raspberry Pi OS
          * Mindestens 1GB RAM (2GB+ empfohlen)
          * Desktop-Umgebung (X11/Wayland)
          
          ## Deinstallation
          ```bash
          sudo apt-get remove --purge mthbdeiotclient
          sudo apt-get autoremove
          rm -rf ~/.config/MthBdeIotClient
          rm -rf ~/.local/share/MthBdeIotClient
          ```
          
          **Build Information:**
          * Version: $(releaseVersion)
          * Build: $(Build.BuildNumber)
          * Pipeline: Azure DevOps automatische Release-Generierung
          * Datum: $[format('{0:yyyy-MM-dd HH:mm:ss} UTC', pipeline.startTime)]
          
          *Dieses Release wurde automatisch durch Azure DevOps erstellt und enthält nur die fertigen Anwendungspakete.*
        assets: '$(Pipeline.Workspace)/all-packages/*.deb'
        assetUploadMode: 'replace'
